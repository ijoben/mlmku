<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Login · HEDTRO JEANS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --denim-dark: #0b1a2b; --denim-navy: #1a2e44; --denim-blue: #2a4b6e; --denim-light: #e8edf2;
            --gold-accent: #d97706; --gold-light: #fef3c7; --cream: #f7f4ef; --white: #ffffff;
            --shadow-lg: 0 20px 60px rgba(0,0,0,0.15); --radius: 24px; --radius-sm: 12px; --transition: 0.3s ease;
        }
        body { font-family: 'Inter', -apple-system, sans-serif; background: var(--cream); color: var(--denim-dark); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-wrapper { max-width: 440px; width: 100%; }
        .login-card { background: var(--white); border-radius: var(--radius); padding: 36px 34px 40px; box-shadow: var(--shadow-lg); border: 1px solid var(--denim-light); }
        .login-card .logo { text-align: center; margin-bottom: 24px; }
        .login-card .logo h1 { font-family: 'Playfair Display', serif; font-size: 1.8rem; font-weight: 800; color: var(--denim-dark); }
        .login-card .logo h1 i { color: var(--gold-accent); }
        .login-card .logo p { color: var(--denim-navy); font-size: 0.85rem; opacity: 0.7; margin-top: 2px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-weight: 600; color: var(--denim-navy); font-size: 0.8rem; margin-bottom: 4px; }
        .form-group input { width: 100%; padding: 12px 18px; border: 1.5px solid var(--denim-light); border-radius: 60px; font-size: 0.95rem; background: var(--cream); color: var(--denim-dark); outline: none; transition: var(--transition); }
        .form-group input:focus { border-color: var(--gold-accent); }
        .btn-login { width: 100%; padding: 14px; border: none; border-radius: 60px; background: linear-gradient(135deg, #d97706 0%, #b45309 100%); color: #ffffff; font-weight: 700; font-size: 1rem; cursor: pointer; transition: var(--transition); margin-top: 4px; box-shadow: 0 4px 14px rgba(217, 119, 6, 0.3); }
        .btn-login:hover { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); transform: translateY(-2px); box-shadow: 0 6px 18px rgba(217, 119, 6, 0.45); }
        .login-footer { text-align: center; margin-top: 24px; font-size: 0.85rem; color: var(--denim-navy); }
        .login-footer a { color: var(--gold-accent); font-weight: 600; text-decoration: none; }
        .msg { margin-top: 12px; text-align: center; font-size: 0.85rem; min-height: 24px; padding: 8px; border-radius: var(--radius-sm); }
        .msg.error { background: #fde8e8; color: #b13e3e; }
        .msg.success { background: #e8f5ed; color: #1f7a4b; }
        .back-link { display: inline-block; margin-top: 16px; color: var(--denim-navy); font-size: 0.8rem; opacity: 0.6; text-decoration: none; }
        .back-link:hover { opacity: 1; color: var(--gold-accent); }
        .loading { opacity: 0.7; pointer-events: none; }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="logo">
                <h1 id="loginLogoHeading"><i class="fas fa-tshirt"></i> HEDTRO JEANS</h1>
                <p>Masuk ke akun member Anda</p>
            </div>

            <div id="loginForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" placeholder="email@domain.com" autocomplete="email" />
                </div>
                <div class="form-group">
                    <label>Kata Sandi</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password" />
                </div>
                <div style="text-align: right; margin-top: -6px; margin-bottom: 14px;">
                    <a href="#" id="forgotPasswordLink" style="font-size: 0.8rem; color: var(--gold-accent); text-decoration: none; font-weight: 600;">Lupa kata sandi?</a>
                </div>
                <button type="button" class="btn-login" id="loginBtn"><i class="fas fa-sign-in-alt"></i> Masuk</button>
                <div class="msg" id="loginMsg"></div>
            </div>

            <!-- FORGOT PASSWORD FORM -->
            <div id="forgotForm" style="display: none;">
                <p style="font-size: 0.85rem; color: var(--denim-navy); margin-bottom: 16px; text-align: center; opacity: 0.85;">Masukkan alamat email terdaftar Anda. Kami akan mengirimkan tautan untuk mengatur ulang kata sandi ke inbox email Anda.</p>
                <div class="form-group">
                    <label>Alamat Email Terdaftar</label>
                    <input type="email" id="forgotEmail" placeholder="email@domain.com" autocomplete="email" />
                </div>
                <button type="button" class="btn-login" id="sendResetBtn"><i class="fas fa-paper-plane"></i> Kirim Link Reset Password</button>
                <div class="msg" id="forgotMsg"></div>
                <div style="text-align: center; margin-top: 14px;">
                    <a href="#" id="backToLoginLink" style="font-size: 0.85rem; color: var(--denim-navy); text-decoration: none; font-weight: 600;"><i class="fas fa-arrow-left"></i> Kembali ke Halaman Login</a>
                </div>
            </div>

            <div class="login-footer">
                Belum punya akun? <a href="/register">Daftar di sini</a>
            </div>
            <div style="text-align:center; margin-top:12px;">
                <a href="/" class="back-link"><i class="fas fa-arrow-left"></i> Kembali ke Beranda</a>
            </div>
        </div>
    </div>


    <script>
        (function() {
            'use strict';

            // ========== CEK SESSION ==========
            async function checkSession() {
                try {
                    const session = await window.getSession();
                    if (session) {
                        const profile = await window.getUserProfile();
                        if (profile) {
                            window.location.href = profile.role === 'admin' ? '/admin' : '/dashboard';
                        }
                    }
                } catch (e) {
                    console.warn('Session check error:', e);
                }
            }
            checkSession();

            // ========== LOGIN ==========
            const loginBtn = document.getElementById('loginBtn');
            const emailInput = document.getElementById('loginEmail');
            const passwordInput = document.getElementById('loginPassword');
            const msgEl = document.getElementById('loginMsg');

            async function doLogin() {
                const email = emailInput.value.trim();
                const password = passwordInput.value.trim();

                // Reset message
                msgEl.className = 'msg';
                msgEl.innerText = '';

                if (!email || !password) {
                    msgEl.className = 'msg error';
                    msgEl.innerText = '⚠️ Isi email dan password.';
                    return;
                }

                // Loading state
                loginBtn.disabled = true;
                loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Memproses...';
                loginBtn.classList.add('loading');

                try {
                    console.log('🔵 Mencoba login:', email);
                    
                    const { user, session } = await window.signIn(email, password);
                    console.log('✅ Login berhasil:', user.email);

                    // Ambil profile dari tabel users
                    const profile = await window.getUserProfile();
                    console.log('✅ Profile:', profile);

                    msgEl.className = 'msg success';
                    msgEl.innerText = '✅ Login berhasil! Mengarahkan...';

                    setTimeout(() => {
                        if (profile?.role === 'admin') {
                            window.location.href = '/admin';
                        } else {
                            window.location.href = '/dashboard';
                        }
                    }, 1000);

                } catch (error) {
                    console.error('❌ Login error:', error);
                    
                    let errorMsg = error.message || 'Terjadi kesalahan.';
                    // Pesan error yang lebih user-friendly
                    if (errorMsg.includes('Invalid login credentials')) {
                        errorMsg = 'Email atau password salah.';
                    } else if (errorMsg.includes('Email not confirmed')) {
                        errorMsg = 'Email belum diverifikasi. Cek inbox Anda.';
                    }
                    
                    msgEl.className = 'msg error';
                    msgEl.innerText = '❌ ' + errorMsg;
                    
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Masuk';
                    loginBtn.classList.remove('loading');
                }
            }

            // Event listeners
            loginBtn.addEventListener('click', doLogin);
            passwordInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    doLogin();
                }
            });
            emailInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    passwordInput.focus();
                }
            });

            // ========== TOGGLE FORGOT PASSWORD FORM ==========
            const forgotPasswordLink = document.getElementById('forgotPasswordLink');
            const backToLoginLink = document.getElementById('backToLoginLink');
            const loginForm = document.getElementById('loginForm');
            const forgotForm = document.getElementById('forgotForm');
            const sendResetBtn = document.getElementById('sendResetBtn');
            const forgotEmailInput = document.getElementById('forgotEmail');
            const forgotMsgEl = document.getElementById('forgotMsg');

            if (forgotPasswordLink) {
                forgotPasswordLink.addEventListener('click', function(e) {
                    e.preventDefault();
                    loginForm.style.display = 'none';
                    forgotForm.style.display = 'block';
                    forgotEmailInput.value = emailInput.value || '';
                    forgotEmailInput.focus();
                });
            }

            if (backToLoginLink) {
                backToLoginLink.addEventListener('click', function(e) {
                    e.preventDefault();
                    forgotForm.style.display = 'none';
                    loginForm.style.display = 'block';
                });
            }

            // ========== SEND RESET PASSWORD EMAIL ==========
            async function doSendResetPassword() {
                const email = forgotEmailInput.value.trim();

                forgotMsgEl.className = 'msg';
                forgotMsgEl.innerText = '';

                if (!email) {
                    forgotMsgEl.className = 'msg error';
                    forgotMsgEl.innerText = '⚠️ Masukkan alamat email Anda.';
                    return;
                }

                sendResetBtn.disabled = true;
                sendResetBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Mengirim email...';

                try {
                    console.log('🔵 Mengirim link reset password ke:', email);
                    await window.resetPasswordForEmail(email);

                    forgotMsgEl.className = 'msg success';
                    forgotMsgEl.innerText = '✅ Link reset kata sandi telah dikirim ke email Anda! Silakan cek inbox/folder spam email Anda.';
                    sendResetBtn.style.display = 'none';

                } catch (error) {
                    console.error('❌ Reset password error:', error);
                    let errorMsg = error.message || 'Gagal mengirim email reset password.';
                    if (errorMsg.includes('User not found')) {
                        errorMsg = 'Email tidak terdaftar dalam sistem.';
                    } else if (errorMsg.includes('For security purposes')) {
                        errorMsg = 'Tunggu beberapa saat sebelum mencoba mengirim ulang.';
                    }
                    forgotMsgEl.className = 'msg error';
                    forgotMsgEl.innerText = '❌ ' + errorMsg;
                    sendResetBtn.disabled = false;
                    sendResetBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Kirim Link Reset Password';
                }
            }

            if (sendResetBtn) {
                sendResetBtn.addEventListener('click', doSendResetPassword);
            }
            if (forgotEmailInput) {
                forgotEmailInput.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        doSendResetPassword();
                    }
                });
            }

        })();
    </script>
</body>
</html>
