<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Atur Ulang Kata Sandi · HEDTRO JEANS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --denim-dark: #0b1a2b; --denim-navy: #1a2e44; --denim-blue: #2a4b6e; --denim-light: #e8edf2;
            --gold-accent: #c9a84c; --gold-light: #e8d5a3; --cream: #f7f4ef; --white: #ffffff;
            --shadow-lg: 0 20px 60px rgba(0,0,0,0.15); --radius: 24px; --radius-sm: 12px; --transition: 0.3s ease;
        }
        body { font-family: 'Inter', -apple-system, sans-serif; background: var(--cream); color: var(--denim-dark); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .reset-wrapper { max-width: 440px; width: 100%; }
        .reset-card { background: var(--white); border-radius: var(--radius); padding: 36px 34px 40px; box-shadow: var(--shadow-lg); border: 1px solid var(--denim-light); }
        .reset-card .logo { text-align: center; margin-bottom: 24px; }
        .reset-card .logo h1 { font-family: 'Playfair Display', serif; font-size: 1.8rem; font-weight: 800; color: var(--denim-dark); }
        .reset-card .logo h1 i { color: var(--gold-accent); }
        .reset-card .logo p { color: var(--denim-navy); font-size: 0.85rem; opacity: 0.7; margin-top: 4px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-weight: 600; color: var(--denim-navy); font-size: 0.8rem; margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 12px 18px; border: 1.5px solid var(--denim-light); border-radius: 60px; font-size: 0.95rem; background: var(--cream); color: var(--denim-dark); outline: none; transition: var(--transition); }
        .form-group input:focus { border-color: var(--gold-accent); }
        .btn-reset { width: 100%; padding: 14px; border: none; border-radius: 60px; background: var(--gold-accent); color: var(--denim-dark); font-weight: 700; font-size: 1rem; cursor: pointer; transition: var(--transition); margin-top: 6px; }
        .btn-reset:hover { background: #b8963a; transform: scale(0.98); }
        .msg { margin-top: 14px; text-align: center; font-size: 0.85rem; min-height: 24px; padding: 10px; border-radius: var(--radius-sm); }
        .msg.error { background: #fde8e8; color: #b13e3e; }
        .msg.success { background: #e8f5ed; color: #1f7a4b; }
        .back-link { display: inline-block; margin-top: 18px; color: var(--denim-navy); font-size: 0.85rem; opacity: 0.7; text-decoration: none; font-weight: 600; }
        .back-link:hover { opacity: 1; color: var(--gold-accent); }
    </style>
</head>
<body>
    <div class="reset-wrapper">
        <div class="reset-card">
            <div class="logo">
                <h1><i class="fas fa-key"></i> HEDTRO JEANS</h1>
                <p>Buat kata sandi baru untuk akun Anda</p>
            </div>

            <div id="resetForm">
                <div class="form-group">
                    <label>Kata Sandi Baru (Min. 6 Karakter)</label>
                    <input type="password" id="newPassword" placeholder="••••••••" autocomplete="new-password" />
                </div>
                <div class="form-group">
                    <label>Konfirmasi Kata Sandi Baru</label>
                    <input type="password" id="confirmPassword" placeholder="••••••••" autocomplete="new-password" />
                </div>
                <button type="button" class="btn-reset" id="savePasswordBtn"><i class="fas fa-save"></i> Simpan Kata Sandi Baru</button>
                <div class="msg" id="resetMsg"></div>
            </div>

            <div style="text-align:center; margin-top:12px;">
                <a href="login.html" class="back-link"><i class="fas fa-arrow-left"></i> Kembali ke Halaman Login</a>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            const newPasswordInput = document.getElementById('newPassword');
            const confirmPasswordInput = document.getElementById('confirmPassword');
            const savePasswordBtn = document.getElementById('savePasswordBtn');
            const msgEl = document.getElementById('resetMsg');

            // Listen to Supabase auth events
            if (window.supabase) {
                window.supabase.auth.onAuthStateChange((event, session) => {
                    console.log('🔵 Auth state change on reset page:', event);
                    if (event === 'PASSWORD_RECOVERY') {
                        msgEl.className = 'msg success';
                        msgEl.innerText = 'ℹ️ Sesi pemulihan aktif. Silakan masukkan kata sandi baru Anda di bawah.';
                    }
                });
            }

            async function doUpdatePassword() {
                const newPassword = newPasswordInput.value.trim();
                const confirmPassword = confirmPasswordInput.value.trim();

                msgEl.className = 'msg';
                msgEl.innerText = '';

                if (!newPassword || !confirmPassword) {
                    msgEl.className = 'msg error';
                    msgEl.innerText = '⚠️ Isi kedua kolom kata sandi.';
                    return;
                }

                if (newPassword.length < 6) {
                    msgEl.className = 'msg error';
                    msgEl.innerText = '⚠️ Kata sandi minimal 6 karakter.';
                    return;
                }

                if (newPassword !== confirmPassword) {
                    msgEl.className = 'msg error';
                    msgEl.innerText = '⚠️ Konfirmasi kata sandi tidak cocok.';
                    return;
                }

                savePasswordBtn.disabled = true;
                savePasswordBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyimpan...';

                try {
                    console.log('🔵 Memperbarui password user...');
                    await window.updateUserPassword(newPassword);

                    msgEl.className = 'msg success';
                    msgEl.innerText = '✅ Kata sandi berhasil diperbarui! Mengarahkan ke halaman login...';

                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);

                } catch (error) {
                    console.error('❌ Gagal memperbarui password:', error);
                    msgEl.className = 'msg error';
                    msgEl.innerText = '❌ Gagal memperbarui kata sandi: ' + (error.message || 'Terjadi kesalahan.');
                    savePasswordBtn.disabled = false;
                    savePasswordBtn.innerHTML = '<i class="fas fa-save"></i> Simpan Kata Sandi Baru';
                }
            }

            savePasswordBtn.addEventListener('click', doUpdatePassword);
            confirmPasswordInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    doUpdatePassword();
                }
            });
        })();
    </script>
</body>
</html>
