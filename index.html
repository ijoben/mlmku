<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>HEDTRO JEANS · Premium Denim</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --denim-dark: #0b1a2b;
            --denim-navy: #1a2e44;
            --denim-blue: #2a4b6e;
            --denim-light: #e8edf2;
            --gold-accent: #c9a84c;
            --gold-light: #e8d5a3;
            --cream: #f7f4ef;
            --white: #ffffff;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.15);
            --radius: 24px;
            --radius-sm: 12px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        body { font-family: 'Inter', sans-serif; background: var(--cream); color: var(--denim-dark); overflow-x: hidden; padding-top: 80px; }
        .app-container { max-width: 1280px; margin: 0 auto; padding: 0 20px; }
        a { text-decoration: none; color: inherit; }
        button { cursor: pointer; font-family: inherit; border: none; background: none; }

        .navbar { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; background: var(--denim-dark); padding: 10px 28px; display: flex; align-items: center; justify-content: space-between; border-bottom: 3px solid var(--gold-accent); height: 80px; }
        .navbar .logo { display: flex; align-items: center; gap: 8px; color: var(--white); font-weight: 800; font-size: 1.4rem; }
        .navbar .logo i { color: var(--gold-accent); font-size: 1.6rem; }
        .nav-menu { display: flex; align-items: center; gap: 4px; list-style: none; }
        .nav-menu li a { color: var(--cream); font-size: 0.8rem; font-weight: 500; padding: 8px 14px; border-radius: 60px; transition: var(--transition); }
        .nav-menu li a:hover { background: rgba(201, 168, 76, 0.12); color: var(--gold-accent); }
        .nav-actions { display: flex; align-items: center; gap: 12px; }

        .carousel-section { position: relative; width: 100%; height: 70vh; min-height: 400px; overflow: hidden; background: var(--denim-dark); border-radius: var(--radius); margin: 8px 0 20px; }
        .carousel-track { display: flex; height: 100%; transition: transform 0.8s ease; }
        .carousel-slide { min-width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; padding: 40px; background-size: cover; background-position: center; position: relative; }
        .carousel-slide .slide-content { text-align: center; color: var(--white); z-index: 2; max-width: 700px; }
        .carousel-slide .slide-content h2 { font-size: 3rem; font-weight: 800; margin-bottom: 12px; }
        .carousel-slide .slide-content p { font-size: 1.1rem; color: var(--gold-light); }

        .section-title { font-size: 1.6rem; font-weight: 700; color: var(--denim-dark); padding: 32px 0 16px; display: flex; align-items: center; gap: 12px; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .product-card { background: var(--white); border-radius: var(--radius-sm); overflow: hidden; box-shadow: var(--shadow); border: 1px solid #e8edf2; }
        .product-card .img-placeholder { height: 180px; background: var(--denim-light); display: flex; align-items: center; justify-content: center; font-size: 3rem; color: var(--denim-blue); }
        .product-card .body { padding: 16px; }

        .features { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; padding: 20px 0 40px; }
        .feature-item { background: var(--white); border-radius: var(--radius-sm); padding: 20px 16px; text-align: center; box-shadow: var(--shadow); }
        .feature-item i { font-size: 2rem; color: var(--gold-accent); margin-bottom: 8px; }

        .about-section, .faq-section { padding: 40px 30px; background: var(--white); margin-bottom: 20px; border-radius: var(--radius); box-shadow: var(--shadow); }
        .faq-item { border-bottom: 1px solid var(--denim-light); padding: 14px 0; }
        .faq-item .faq-question { display: flex; justify-content: space-between; cursor: pointer; font-weight: 600; }
        .faq-item .faq-answer { display: none; padding-top: 10px; color: var(--denim-navy); }
        .faq-item .faq-answer.open { display: block; }

        .footer { background: var(--denim-dark); color: var(--cream); padding: 40px 28px 20px; border-top: 3px solid var(--gold-accent); margin-top: 20px; }
        .footer-grid { display: grid; grid-template-columns: 1.5fr 1fr 1fr 1.2fr; gap: 30px; max-width: 1280px; margin: 0 auto 30px; }
        .social-icons a { display:inline-flex; width:36px; height:36px; border-radius:50%; background:rgba(255,255,255,0.06); align-items:center; justify-content:center; color:#fff; margin-right:6px; }

        @media (max-width: 768px) {
            body { padding-top: 64px; }
            .navbar { padding: 10px 16px; height: 64px; }
            .nav-menu { display: none; }
            .carousel-section { height: 60vh; }
            .footer-grid { grid-template-columns: 1fr 1fr; gap: 20px; }
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="logo"><i class="fas fa-tshirt"></i> HEDTRO<span>JEANS</span></div>
        <ul class="nav-menu">
            <li><a href="#home">Beranda</a></li>
            <li><a href="#products">Koleksi</a></li>
            <li><a href="#about">Tentang</a></li>
            <li><a href="#faq">FAQ</a></li>
        </ul>
        <div class="nav-actions">
            <a href="admin.html" style="background:var(--gold-accent); color:var(--denim-dark); padding:8px 18px; border-radius:60px; font-weight:700; font-size:0.8rem;">Admin</a>
        </div>
    </header>

    <div class="app-container" id="home">

        <!-- CAROUSEL (DARI ADMIN) -->
        <section class="carousel-section">
            <div class="carousel-track" id="carouselTrack"></div>
        </section>

        <!-- PRODUK -->
        <h2 class="section-title" id="products"><i class="fas fa-fire"></i> KOLEKSI DENIM</h2>
        <div class="product-grid" id="productGrid"></div>

        <!-- TENTANG KAMI (DARI ADMIN) -->
        <div class="about-section" id="about">
            <h2 id="aboutTitleEl"><i class="fas fa-info-circle"></i> Tentang Kami</h2>
            <div id="aboutContentEl" style="line-height:1.8; margin-top:12px;"></div>
        </div>

        <!-- FAQ (DARI ADMIN) -->
        <div class="faq-section" id="faq">
            <h2><i class="fas fa-question-circle"></i> Pertanyaan yang Sering Diajukan</h2>
            <div id="faqContainer"></div>
        </div>

        <!-- KEUNGGULAN (DARI ADMIN) -->
        <div class="features" id="featureContainer"></div>

    </div>

    <!-- FOOTER (DARI ADMIN) -->
    <footer class="footer">
        <div class="footer-grid">
            <div>
                <h4 id="footerBrandEl" style="color:var(--gold-light); margin-bottom:10px;">HEDTRO JEANS</h4>
                <p id="footerDescEl" style="font-size:0.85rem; opacity:0.7; line-height:1.6;"></p>
                <div class="social-icons" id="socialIcons" style="margin-top:12px;"></div>
            </div>
            <div>
                <h4 style="color:var(--gold-light); margin-bottom:10px;">Katalog</h4>
                <p style="font-size:0.8rem; opacity:0.6;">Celana Jeans<br/>Jaket Denim<br/>Aksesoris</p>
            </div>
            <div>
                <h4 style="color:var(--gold-light); margin-bottom:10px;">Layanan</h4>
                <p style="font-size:0.8rem; opacity:0.6;">Lacak Pesanan<br/>Garansi 30 Hari</p>
            </div>
            <div>
                <h4 style="color:var(--gold-light); margin-bottom:10px;">Kontak</h4>
                <p style="font-size:0.8rem; opacity:0.6;">cs@hedtrojeans.com<br/>+62 812 3456 7890</p>
            </div>
        </div>
        <div style="text-align:center; font-size:0.75rem; opacity:0.4; padding-top:16px; border-top:1px solid rgba(255,255,255,0.1);" id="footerCopyrightEl"></div>
    </footer>

    <script>
        (function() {
            'use strict';

            const PRODUCT_KEY = 'hedtro_products';
            const SLIDES_KEY = 'hedtro_slides';
            const ABOUT_KEY = 'hedtro_about';
            const FAQ_KEY = 'hedtro_faq';
            const FEATURES_KEY = 'hedtro_features';
            const FOOTER_KEY = 'hedtro_footer';

            // FUNCTION LOAD DARI LOCALSTORAGE
            function renderAllFromAdmin() {
                renderSlides();
                renderProducts();
                renderAbout();
                renderFaq();
                renderFeatures();
                renderFooter();
            }

            function renderSlides() {
                const track = document.getElementById('carouselTrack');
                const slides = JSON.parse(localStorage.getItem(SLIDES_KEY) || '[]');
                if(slides.length === 0) {
                    track.innerHTML = `
                        <div class="carousel-slide" style="background: linear-gradient(135deg, #0b1a2b 0%, #1a2e44 100%);">
                            <div class="slide-content">
                                <h2>HEDTRO JEANS</h2>
                                <p>Premium Raw Denim 14oz</p>
                            </div>
                        </div>
                    `;
                    return;
                }
                track.innerHTML = slides.map(s => `
                    <div class="carousel-slide" style="background: linear-gradient(135deg, #0b1a2b 0%, #2a4b6e 100%); ${s.image ? `background-image:url('${s.image}');background-size:cover;` : ''}">
                        <div class="slide-content">
                            <h2>${s.title}</h2>
                            <p>${s.subtitle || ''}</p>
                        </div>
                    </div>
                `).join('');
            }

            function renderProducts() {
                const grid = document.getElementById('productGrid');
                const products = JSON.parse(localStorage.getItem(PRODUCT_KEY) || '[]');
                if(products.length === 0) {
                    grid.innerHTML = '<p style="grid-column:1/-1; text-align:center; color:#888;">Belum ada produk.</p>';
                    return;
                }
                grid.innerHTML = products.map(p => `
                    <div class="product-card">
                        <div class="img-placeholder"><i class="fas ${p.icon || 'fa-tshirt'}"></i></div>
                        <div class="body">
                            <h4>${p.name}</h4>
                            <div style="font-weight:700; color:var(--denim-blue); margin-top:4px;">Rp ${(p.price||0).toLocaleString()}</div>
                        </div>
                    </div>
                `).join('');
            }

            function renderAbout() {
                const about = JSON.parse(localStorage.getItem(ABOUT_KEY) || '{"title":"Tentang Kami","content":"Deskripsi belum diatur oleh admin."}');
                document.getElementById('aboutTitleEl').innerHTML = `<i class="fas fa-info-circle"></i> ${about.title || 'Tentang Kami'}`;
                document.getElementById('aboutContentEl').innerHTML = about.content || '';
            }

            function renderFaq() {
                const container = document.getElementById('faqContainer');
                const faqs = JSON.parse(localStorage.getItem(FAQ_KEY) || '[]');
                if(faqs.length === 0) {
                    container.innerHTML = '<p style="color:#888;">Belum ada pertanyaan FAQ.</p>';
                    return;
                }
                container.innerHTML = faqs.map(f => `
                    <div class="faq-item">
                        <div class="faq-question" onclick="this.nextElementSibling.classList.toggle('open')">
                            <span>${f.question}</span>
                            <i class="fas fa-chevron-down"></i>
                        </div>
                        <div class="faq-answer">${f.answer}</div>
                    </div>
                `).join('');
            }

            function renderFeatures() {
                const container = document.getElementById('featureContainer');
                const feats = JSON.parse(localStorage.getItem(FEATURES_KEY) || '[]');
                if(feats.length === 0) {
                    container.innerHTML = `
                        <div class="feature-item"><i class="fas fa-check-circle"></i><h4>100% OTENTIK</h4><p>Raw Denim 14oz</p></div>
                        <div class="feature-item"><i class="fas fa-shipping-fast"></i><h4>GRATIS ONGKIR</h4><p>Seluruh Indonesia</p></div>
                    `;
                    return;
                }
                container.innerHTML = feats.map(f => `
                    <div class="feature-item">
                        <i class="fas ${f.icon || 'fa-check-circle'}"></i>
                        <h4>${f.title}</h4>
                        <p>${f.desc}</p>
                    </div>
                `).join('');
            }

            function renderFooter() {
                const f = JSON.parse(localStorage.getItem(FOOTER_KEY) || '{"brand":"HEDTRO JEANS","desc":"","copyright":"© 2026 HEDTRO JEANS","social":{}}');
                document.getElementById('footerBrandEl').textContent = f.brand || 'HEDTRO JEANS';
                document.getElementById('footerDescEl').textContent = f.desc || '';
                document.getElementById('footerCopyrightEl').innerHTML = f.copyright || '&copy; 2026 HEDTRO JEANS · All Rights Reserved';

                const socialContainer = document.getElementById('socialIcons');
                let icons = '';
                if(f.social?.instagram) icons += `<a href="${f.social.instagram}" target="_blank"><i class="fab fa-instagram"></i></a>`;
                if(f.social?.facebook) icons += `<a href="${f.social.facebook}" target="_blank"><i class="fab fa-facebook-f"></i></a>`;
                if(f.social?.youtube) icons += `<a href="${f.social.youtube}" target="_blank"><i class="fab fa-youtube"></i></a>`;
                if(f.social?.tiktok) icons += `<a href="${f.social.tiktok}" target="_blank"><i class="fab fa-tiktok"></i></a>`;
                socialContainer.innerHTML = icons;
            }

            // LISTEN UNTUK UPDATE OTOMATIS SAAT ADMIN SIMPAN
            window.addEventListener('storage', function(e) {
                renderAllFromAdmin();
            });

            // LOAD PERTAMA KALI
            renderAllFromAdmin();

        })();
    </script>
</body>
</html>
