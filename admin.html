<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Admin · HEDTRO JEANS</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --denim-dark: #0b1a2b; --denim-navy: #1a2e44; --denim-blue: #2a4b6e; --denim-light: #e8edf2;
      --gold-accent: #c9a84c; --cream: #f7f4ef; --white: #ffffff;
      --shadow: 0 4px 20px rgba(0,0,0,0.08); --radius-sm: 14px; --transition: 0.3s ease; --sidebar-width: 280px;
    }
    body { font-family: 'Inter', sans-serif; background: var(--cream); color: var(--denim-dark); padding-top: 70px; }
    a { text-decoration:none; color:inherit; }

    .navbar {
      position: fixed; top:0; left:0; right:0; z-index:1100; background: var(--denim-dark);
      padding: 12px 20px; display: flex; align-items:center; justify-content:space-between;
      border-bottom:3px solid var(--gold-accent); height:70px;
    }
    .navbar .logo { color:var(--white); font-weight:800; font-size:1.4rem; display:flex; align-items:center; gap:8px; }

    .sidebar {
      position:fixed; top:0; left:0; bottom:0; width:var(--sidebar-width);
      background:var(--denim-dark); z-index:1060; padding:24px 20px;
      border-right:3px solid var(--gold-accent); display:flex; flex-direction:column; gap:4px;
    }
    @media (max-width: 768px) { .sidebar { display:none; } }
    .sidebar .menu-item {
      display:flex; align-items:center; gap:14px; padding:12px 16px; border-radius:12px;
      color:var(--cream); font-weight:500; cursor:pointer;
    }
    .sidebar .menu-item.active { background:rgba(201,168,76,0.15); color:var(--gold-accent); }

    .main-content { margin-left: var(--sidebar-width); padding: 20px 24px 40px; }
    @media (max-width: 768px) { .main-content { margin-left: 0; padding: 16px; } }

    .admin-tabs { display:flex; gap:8px; margin-bottom:20px; border-bottom:2px solid var(--denim-light); padding-bottom:12px; }
    .admin-tabs .tab-btn { padding:10px 22px; border-radius:60px; font-weight:600; font-size:0.85rem; cursor:pointer; background:transparent; border:none; }
    .admin-tabs .tab-btn.active { background:var(--denim-blue); color:#fff; }

    .tab-content { display:none; }
    .tab-content.active { display:block; }

    .btn-sm { padding:8px 18px; border-radius:60px; font-weight:600; font-size:0.8rem; border:none; cursor:pointer; }
    .btn-sm-primary { background:var(--denim-blue); color:#fff; }
    .btn-sm-success { background:#1f7a4b; color:#fff; }
    .btn-sm-danger { background:#b13e3e; color:#fff; }
    .btn-sm-warning { background:#d4a02b; color:#fff; }

    .table-wrap { overflow-x:auto; border-radius:var(--radius-sm); border:1px solid #e2e8f0; background:var(--white); }
    table { width:100%; border-collapse:collapse; font-size:0.82rem; min-width:700px; }
    thead { background:var(--denim-dark); color:var(--cream); }
    th, td { padding:12px 14px; text-align:left; border-bottom:1px solid #eef2f7; }

    .badge-status { padding:2px 12px; border-radius:40px; font-size:0.7rem; font-weight:600; }
    .badge-verified { background:#d4edda; color:#155724; }
    .badge-pending { background:#fff3cd; color:#856404; }
    .badge-free { background:#f8d7da; color:#721c24; }
  </style>
</head>
<body>

  <header class="navbar">
    <div class="logo"><i class="fas fa-tshirt"></i> HEDTRO<span>JEANS</span> · Admin</div>
    <div style="color:#fff; font-weight:600;"><i class="fas fa-user-cog"></i> Admin Utama</div>
  </header>

  <nav class="sidebar">
    <div class="menu-item active" data-tab="members"><i class="fas fa-users"></i> Member</div>
    <div class="menu-item" data-tab="products"><i class="fas fa-boxes"></i> Produk</div>
    <div class="menu-item" data-tab="verification"><i class="fas fa-check-double"></i> Verifikasi</div>
    <div class="menu-item" data-tab="ro-orders"><i class="fas fa-shopping-cart"></i> RO Orders</div>
    <div class="menu-item" id="sideLogoutBtn" style="margin-top:auto; color:#e74c3c;"><i class="fas fa-sign-out-alt"></i> Keluar</div>
  </nav>

  <div class="main-content">
    <h1 style="font-size:1.6rem; margin-bottom:20px;"><i class="fas fa-users-cog"></i> Panel Pengelola Admin</h1>

    <div class="admin-tabs">
      <button class="tab-btn active" data-tab="members">Member</button>
      <button class="tab-btn" data-tab="products">Produk</button>
      <button class="tab-btn" data-tab="verification">Verifikasi</button>
      <button class="tab-btn" data-tab="ro-orders">RO Orders</button>
    </div>

    <div class="tab-content active" id="tabMembers">
      <div style="margin-bottom:12px; display:flex; gap:8px;">
        <button class="btn-sm btn-sm-primary" id="refreshBtn"><i class="fas fa-sync"></i> Refresh</button>
        <button class="btn-sm btn-sm-danger" id="resetAllBtn"><i class="fas fa-trash"></i> Reset Data Non-Admin</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>ID</th><th>Nama</th><th>Email</th><th>Status</th><th>Saldo Wallet</th><th>Aksi</th></tr></thead>
          <tbody id="adminTableBody"></tbody>
        </table>
      </div>
    </div>

    <div class="tab-content" id="tabProducts">
      <div style="margin-bottom:12px;">
        <button class="btn-sm btn-sm-success" id="addProductBtn"><i class="fas fa-plus"></i> Tambah Produk</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>ID</th><th>Nama Produk</th><th>Harga</th><th>Stok</th><th>Aksi</th></tr></thead>
          <tbody id="adminProductTableBody"></tbody>
        </table>
      </div>
    </div>

    <div class="tab-content" id="tabVerification">
      <div class="table-wrap">
        <table>
          <thead><tr><th>ID</th><th>Nama</th><th>Email</th><th>Status</th><th>Aksi</th></tr></thead>
          <tbody id="verifTableBody"></tbody>
        </table>
      </div>
    </div>

    <div class="tab-content" id="tabRoOrders">
      <div class="table-wrap">
        <table>
          <thead><tr><th>#</th><th>Member</th><th>Produk ID</th><th>Nominal</th><th>Status</th><th>Aksi</th></tr></thead>
          <tbody id="roOrdersTable"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    (function() {
      'use strict';
      const DB_KEY = 'hedtro_mlm_users';
      const PRODUCT_KEY = 'hedtro_products';

      function loadUsers() { return JSON.parse(localStorage.getItem(DB_KEY) || '[]'); }
      function saveUsers(u) { localStorage.setItem(DB_KEY, JSON.stringify(u)); }
      function loadProducts() { return JSON.parse(localStorage.getItem(PRODUCT_KEY) || '[]'); }
      function saveProducts(p) { localStorage.setItem(PRODUCT_KEY, JSON.stringify(p)); }

      const session = localStorage.getItem('mlm_session');
      if (session) {
        try {
          const { id } = JSON.parse(session);
          const users = loadUsers();
          const current = users.find(u => u.id === id);
          if (!current || (current.email !== 'admin@mlm.com' && current.role !== 'admin')) {
            window.location.href = 'index.html'; return;
          }
        } catch (_) { window.location.href = 'index.html'; return; }
      } else { window.location.href = 'index.html'; return; }

      function switchTab(tabId) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.sidebar .menu-item').forEach(m => m.classList.remove('active'));

        const btn = document.querySelector(`.tab-btn[data-tab="${tabId}"]`);
        if (btn) btn.classList.add('active');
        const content = document.getElementById('tab' + tabId.charAt(0).toUpperCase() + tabId.slice(1));
        if (content) content.classList.add('active');

        if (tabId === 'members') renderMembers();
        if (tabId === 'products') renderProducts();
        if (tabId === 'verification') renderVerif();
        if (tabId === 'ro-orders') renderRO();
      }

      document.querySelectorAll('.tab-btn, .sidebar .menu-item[data-tab]').forEach(el => {
        el.onclick = function() { switchTab(this.dataset.tab); };
      });

      document.getElementById('sideLogoutBtn').onclick = () => {
        localStorage.removeItem('mlm_session'); window.location.href = 'index.html';
      };

      function renderMembers() {
        const tbody = document.getElementById('adminTableBody');
        const users = loadUsers();
        tbody.innerHTML = users.map(u => `
          <tr>
            <td>${u.id}</td>
            <td>${u.name || u.fullname || u.username}</td>
            <td>${u.email}</td>
            <td><span class="badge-status badge-${u.status || 'free'}">${(u.status || 'free').toUpperCase()}</span></td>
            <td>Rp ${(u.wallet || 0).toLocaleString()}</td>
            <td>${u.role !== 'admin' ? `<button class="btn-sm btn-sm-warning" onclick="toggleStatus(${u.id})">Ubah Status</button>` : '-'}</td>
          </tr>`).join('');
      }

      window.toggleStatus = function(id) {
        let users = loadUsers();
        const user = users.find(u => u.id === id);
        if (user) {
          user.status = user.status === 'verified' ? 'free' : 'verified';
          saveUsers(users); renderMembers();
        }
      };

      function renderProducts() {
        const tbody = document.getElementById('adminProductTableBody');
        const prods = loadProducts();
        tbody.innerHTML = prods.map(p => `
          <tr>
            <td>${p.id}</td>
            <td>${p.name}</td>
            <td>Rp ${p.price.toLocaleString()}</td>
            <td>${p.stock}</td>
            <td><button class="btn-sm btn-sm-danger" onclick="deleteProduct(${p.id})">Hapus</button></td>
          </tr>`).join('');
      }

      window.deleteProduct = function(id) {
        let prods = loadProducts().filter(p => p.id !== id);
        saveProducts(prods); renderProducts();
      };

      document.getElementById('addProductBtn').onclick = () => {
        const name = prompt('Nama Produk:');
        const price = parseInt(prompt('Harga (Rp):'));
        if (name && price) {
          let prods = loadProducts();
          prods.push({ id: prods.length + 1, name, price, stock: 50, favorite: false });
          saveProducts(prods); renderProducts();
        }
      };

      function renderVerif() {
        const tbody = document.getElementById('verifTableBody');
        const users = loadUsers().filter(u => u.role !== 'admin');
        tbody.innerHTML = users.map(u => `
          <tr>
            <td>${u.id}</td>
            <td>${u.name || u.username}</td>
            <td>${u.email}</td>
            <td><span class="badge-status badge-${u.status || 'free'}">${(u.status || 'free').toUpperCase()}</span></td>
            <td>${u.status !== 'verified' ? `<button class="btn-sm btn-sm-success" onclick="verifyUser(${u.id})">✅ Verifikasi</button>` : 'Diverifikasi'}</td>
          </tr>`).join('');
      }

      window.verifyUser = function(id) {
        let users = loadUsers();
        const u = users.find(x => x.id === id);
        if (u) { u.status = 'verified'; saveUsers(users); renderVerif(); }
      };

      function renderRO() {
        const tbody = document.getElementById('roOrdersTable');
        const users = loadUsers();
        let html = '';
        users.forEach(u => {
          (u.transactions || []).forEach((t, idx) => {
            if (t.type === 'ro_purchase') {
              html += `<tr>
                <td>${idx+1}</td>
                <td>${u.name || u.username}</td>
                <td>${t.productId}</td>
                <td>Rp ${t.amount.toLocaleString()}</td>
                <td><span class="badge-status badge-${t.status}">${t.status.toUpperCase()}</span></td>
                <td>${t.status === 'pending' ? `<button class="btn-sm btn-sm-success" onclick="approveRO(${u.id}, '${t.date}')">Approve</button>` : 'Selesai'}</td>
              </tr>`;
            }
          });
        });
        tbody.innerHTML = html || '<tr><td colspan="6" style="text-align:center;">Belum ada pesanan RO</td></tr>';
      }

      window.approveRO = function(userId, date) {
        let users = loadUsers();
        const u = users.find(x => x.id === userId);
        if (u) {
          const tx = (u.transactions || []).find(t => t.date === date);
          if (tx) { tx.status = 'success'; saveUsers(users); renderRO(); alert('✅ Pesanan RO disetujui!'); }
        }
      };

      document.getElementById('refreshBtn').onclick = () => renderMembers();
      document.getElementById('resetAllBtn').onclick = () => {
        if (confirm('Hapus seluruh pengguna non-admin?')) {
          let users = loadUsers().filter(u => u.role === 'admin' || u.email === 'admin@mlm.com');
          saveUsers(users); renderMembers();
        }
      };

      renderMembers();
    })();
  </script>
</body>
</html>
