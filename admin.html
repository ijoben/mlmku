<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin · HEDTRO JEANS</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
  <style>
    /* ===== SAMA DENGAN SEBELUMNYA, TAMBAHKAN BADGE STATUS ===== */
    * { margin:0; padding:0; box-sizing:border-box; }
    :root { /* ... sama ... */ }
    body { font-family:'Inter',sans-serif; background:var(--cream); color:var(--denim-dark); padding-top:70px; }
    /* ... (style navbar, sidebar, content, tabel) sama seperti sebelumnya ... */
    .badge-status { padding:2px 12px; border-radius:40px; font-size:0.7rem; font-weight:600; }
    .badge-pending { background:#fff3cd; color:#856404; }
    .badge-success { background:#d4edda; color:#155724; }
    .badge-failed { background:#f8d7da; color:#721c24; }
    .badge-free { background:#f8d7da; color:#721c24; }
    .badge-verified { background:#d4edda; color:#155724; }
  </style>
</head>
<body>
  <!-- ===== NAVBAR ===== -->
  <header class="navbar">
    <div class="logo"><i class="fas fa-tshirt"></i> HEDTRO<span>JEANS</span></div>
    <div class="nav-right">
      <div class="user-badge" id="navUserBadge"><i class="fas fa-user-cog"></i> <span id="navUserName">Admin</span></div>
      <button class="burger-btn" id="burgerBtn"><span></span><span></span><span></span></button>
    </div>
  </header>

  <!-- ===== SIDEBAR ===== -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo-side"><i class="fas fa-tshirt"></i> HEDTRO</div>
      <span class="close-side" id="closeSidebar">&times;</span>
    </div>
    <div class="menu-item active" data-tab="members"><i class="fas fa-users"></i> Member</div>
    <div class="menu-item" data-tab="products"><i class="fas fa-boxes"></i> Produk</div>
    <div class="menu-item" data-tab="verification"><i class="fas fa-check-double"></i> Verifikasi</div>
    <div class="menu-item" data-tab="ro-orders"><i class="fas fa-shopping-cart"></i> RO Orders</div>
    <div class="menu-item" data-tab="settings"><i class="fas fa-sliders-h"></i> Pengaturan</div>
    <div class="menu-divider"></div>
    <div class="menu-item logout" id="sideLogoutBtn"><i class="fas fa-sign-out-alt"></i> Keluar</div>
  </nav>

  <!-- ===== CONTENT ===== -->
  <div class="main-content">
    <h1 class="page-title"><i class="fas fa-users-cog"></i> Admin Panel</h1>
    <div class="admin-tabs" id="adminTabs">
      <button class="tab-btn active" data-tab="members">Member</button>
      <button class="tab-btn" data-tab="products">Produk</button>
      <button class="tab-btn" data-tab="verification">Verifikasi</button>
      <button class="tab-btn" data-tab="ro-orders">RO Orders</button>
      <button class="tab-btn" data-tab="settings">Pengaturan</button>
    </div>

    <!-- TAB MEMBER -->
    <div class="tab-content active" id="tabMembers">...</div>
    <!-- TAB PRODUK -->
    <div class="tab-content" id="tabProducts">...</div>
    <!-- TAB VERIFIKASI -->
    <div class="tab-content" id="tabVerification">...</div>
    <!-- TAB RO ORDERS -->
    <div class="tab-content" id="tabRoOrders">
      <div class="table-wrap">
        <table>
          <thead><tr><th>ID</th><th>Member</th><th>Produk</th><th>Nominal</th><th>Status</th><th>Tanggal</th><th>Aksi</th></tr></thead>
          <tbody id="roOrdersTable"></tbody>
        </table>
      </div>
    </div>
    <!-- TAB SETTINGS -->
    <div class="tab-content" id="tabSettings">...</div>
  </div>

  <script>
    // ============================================================
    // JAVASCRIPT admin.html (dengan RO Orders)
    // ============================================================
    (function() {
      'use strict';

      const DB_KEY = 'hedtro_mlm_users';
      const PRODUCT_KEY = 'hedtro_products';
      const SETTINGS_KEY = 'hedtro_settings';
      const BANK_KEY = 'hedtro_bank_info';

      function loadUsers() { return JSON.parse(localStorage.getItem(DB_KEY) || '[]'); }
      function saveUsers(u) { localStorage.setItem(DB_KEY, JSON.stringify(u)); }
      function loadProducts() { return JSON.parse(localStorage.getItem(PRODUCT_KEY) || '[]'); }
      function saveProducts(p) { localStorage.setItem(PRODUCT_KEY, JSON.stringify(p)); }
      function loadSettings() { return JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{"sponsorBonus":10,"binaryBonus":8,"rewardBonus":5,"roBonus":3,"memberPrice":550000}'); }
      function saveSettings(s) { localStorage.setItem(SETTINGS_KEY, JSON.stringify(s)); }

      let users = loadUsers();
      let products = loadProducts();
      let settings = loadSettings();

      const session = localStorage.getItem('mlm_session');
      let currentUser = null;
      if (session) {
        try {
          const { id } = JSON.parse(session);
          currentUser = users.find(u => u.id === id);
          if (!currentUser || currentUser.email !== 'admin@mlm.com') {
            window.location.href = 'index.html';
            return;
          }
        } catch (_) { window.location.href = 'index.html'; return; }
      } else {
        window.location.href = 'index.html';
        return;
      }

      // ===== RENDER RO ORDERS =====
      function renderRoOrders() {
        const tbody = document.getElementById('roOrdersTable');
        if (!tbody) return;
        let html = '';
        // Cari semua transaksi ro_purchase dari semua user
        let allRO = [];
        users.forEach(u => {
          if (u.transactions) {
            u.transactions.forEach(t => {
              if (t.type === 'ro_purchase') {
                allRO.push({
                  userId: u.id,
                  userName: u.name,
                  ...t
                });
              }
            });
          }
        });
        // Urutkan dari yang terbaru
        allRO.sort((a,b) => new Date(b.date) - new Date(a.date));

        if (allRO.length === 0) {
          html = '<tr><td colspan="7" style="text-align:center;padding:20px;">Belum ada pesanan RO.</td></tr>';
        } else {
          allRO.forEach((ro, idx) => {
            const statusClass = ro.status === 'pending' ? 'badge-pending' : (ro.status === 'success' ? 'badge-success' : 'badge-failed');
            html += `<tr>
              <td>${idx+1}</td>
              <td>${ro.userName}</td>
              <td>${ro.productName || 'Produk'}</td>
              <td>Rp ${ro.amount.toLocaleString()}</td>
              <td><span class="badge-status ${statusClass}">${ro.status.toUpperCase()}</span></td>
              <td>${new Date(ro.date).toLocaleDateString()}</td>
              <td>
                ${ro.status === 'pending' ? `<button class="btn-sm btn-sm-success approve-ro" data-userid="${ro.userId}" data-txdate="${ro.date}">Approve</button>` : '-'}
              </td>
            </tr>`;
          });
        }
        tbody.innerHTML = html;

        // Event approve RO
        document.querySelectorAll('.approve-ro').forEach(btn => {
          btn.addEventListener('click', function() {
            const userId = parseInt(this.dataset.userid);
            const txDate = this.dataset.txdate;
            approveRO(userId, txDate);
          });
        });
      }

      // ===== FUNGSI APPROVE RO =====
      function approveRO(userId, txDate) {
        if (!confirm('Approve pesanan RO ini? Bonus akan didistribusikan ke upline.')) return;
        const user = users.find(u => u.id === userId);
        if (!user) return;
        // Cari transaksi yang sesuai
        const txIndex = user.transactions.findIndex(t => t.type === 'ro_purchase' && t.date === txDate && t.status === 'pending');
        if (txIndex === -1) { alert('Transaksi tidak ditemukan'); return; }
        // Ubah status menjadi success
        user.transactions[txIndex].status = 'success';
        const amount = user.transactions[txIndex].amount;

        // Update purchase_history juga
        if (user.purchase_history) {
          const phIndex = user.purchase_history.findIndex(p => p.date === txDate);
          if (phIndex !== -1) user.purchase_history[phIndex].status = 'success';
        }

        // Distribusi bonus RO ke upline (sponsor)
        const roBonusPercent = settings.roBonus || 3;
        const bonusRO = (amount * roBonusPercent) / 100;

        // Cari sponsor
        let sponsorId = user.sponsor_id;
        let level = 1;
        while (sponsorId && level <= 10) {
          const sponsor = users.find(u => u.id === sponsorId);
          if (!sponsor) break;
          // Tambahkan bonus RO ke sponsor
          sponsor.bonus_ro = (sponsor.bonus_ro || 0) + bonusRO;
          // Tambahkan ke wallet sponsor?
          sponsor.wallet = (sponsor.wallet || 0) + bonusRO;
          // Catat transaksi bonus di sponsor
          if (!sponsor.transactions) sponsor.transactions = [];
          sponsor.transactions.push({
            type: 'bonus_ro',
            amount: bonusRO,
            date: new Date().toISOString(),
            status: 'success',
            note: `Bonus RO dari ${user.name} (level ${level})`
          });
          // Lanjut ke sponsor berikutnya
          sponsorId = sponsor.sponsor_id;
          level++;
        }

        saveUsers(users);
        renderRoOrders();
        // Refresh tampilan lain
        renderAdminMembers();
        alert('✅ RO approved, bonus telah didistribusikan ke upline.');
      }

      // ===== RENDER ADMIN MEMBERS (sama seperti sebelumnya) =====
      function renderAdminMembers() {
        // ... (sama)
      }

      // ===== RENDER ADMIN PRODUCTS =====
      function renderAdminProducts() {
        // ... (sama)
      }

      // ===== RENDER VERIFICATION =====
      function renderVerification() {
        // ... (sama)
      }

      // ===== SETTINGS =====
      function loadSettingsToForm() {
        // ... (sama)
      }

      // ===== TABS =====
      document.querySelectorAll('.admin-tabs .tab-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          document.querySelectorAll('.admin-tabs .tab-btn').forEach(b => b.classList.remove('active'));
          this.classList.add('active');
          document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
          const tab = this.dataset.tab;
          document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active');
          if (tab === 'members') renderAdminMembers();
          if (tab === 'products') renderAdminProducts();
          if (tab === 'verification') renderVerification();
          if (tab === 'ro-orders') renderRoOrders();
          if (tab === 'settings') loadSettingsToForm();
        });
      });

      // ===== SIDEBAR =====
      // ... (sama)

      // ===== INIT =====
      renderAdminMembers();
      renderAdminProducts();
      renderVerification();
      renderRoOrders();
      loadSettingsToForm();
      console.log('🟦 HEDTRO · Admin dengan RO Orders');
    })();
  </script>
</body>
</html>
