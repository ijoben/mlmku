<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Register · HEDTRO JEANS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
        /* ===== SAMA SEPERTI STYLE LOGIN (copy paste saja) ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --denim-dark: #0b1a2b; --denim-navy: #1a2e44; --denim-blue: #2a4b6e; --denim-light: #e8edf2; --gold-accent: #c9a84c; --gold-light: #e8d5a3; --cream: #f7f4ef; --white: #ffffff; --shadow-lg: 0 20px 60px rgba(0,0,0,0.15); --radius: 24px; --radius-sm: 12px; --transition: 0.3s ease; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: var(--cream); color: var(--denim-dark); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-wrapper { max-width: 440px; width: 100%; }
        .login-card { background: var(--white); border-radius: var(--radius); padding: 36px 34px 40px; box-shadow: var(--shadow-lg); border: 1px solid var(--denim-light); }
        .login-card .logo { text-align: center; margin-bottom: 24px; }
        .login-card .logo h1 { font-family: 'Playfair Display', serif; font-size: 1.8rem; font-weight: 800; color: var(--denim-dark); }
        .login-card .logo h1 i { color: var(--gold-accent); }
        .login-card .logo p { color: var(--denim-navy); font-size: 0.85rem; opacity: 0.7; margin-top: 2px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-weight: 600; color: var(--denim-navy); font-size: 0.8rem; margin-bottom: 4px; }
        .form-group input { width: 100%; padding: 12px 18px; border: 1.5px solid var(--denim-light); border-radius: 60px; font-size: 0.95rem; background: var(--cream); color: var(--denim-dark); outline: none; transition: var(--transition); }
        .form-group input:focus { border-color: var(--gold-accent); }
        .btn-login { width: 100%; padding: 14px; border: none; border-radius: 60px; background: var(--gold-accent); color: var(--denim-dark); font-weight: 700; font-size: 1rem; cursor: pointer; transition: var(--transition); margin-top: 4px; }
        .btn-login:hover { background: #b8963a; transform: scale(0.98); }
        .login-footer { text-align: center; margin-top: 24px; font-size: 0.85rem; color: var(--denim-navy); }
        .login-footer a { color: var(--gold-accent); font-weight: 600; text-decoration: none; }
        .msg { margin-top: 12px; text-align: center; font-size: 0.85rem; min-height: 24px; padding: 8px; border-radius: var(--radius-sm); }
        .msg.error { background: #fde8e8; color: #b13e3e; }
        .msg.success { background: #e8f5ed; color: #1f7a4b; }
        .back-link { display: inline-block; margin-top: 16px; color: var(--denim-navy); font-size: 0.8rem; opacity: 0.6; text-decoration: none; }
        .back-link:hover { opacity: 1; color: var(--gold-accent); }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="logo">
                <h1><i class="fas fa-tshirt"></i> HEDTRO JEANS</h1>
                <p>Buat akun baru Anda</p>
            </div>

            <div>
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="regUsername" placeholder="username" />
                </div>
                <div class="form-group">
                    <label>Nama Lengkap</label>
                    <input type="text" id="regFullname" placeholder="Nama Lengkap" />
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="regEmail" placeholder="email@domain.com" />
                </div>
                <div class="form-group">
                    <label>Kata Sandi</label>
                    <input type="password" id="regPassword" placeholder="Minimal 6 karakter" />
                </div>
                <button type="button" class="btn-login" id="regBtn"><i class="fas fa-user-plus"></i> Daftar</button>
                <div class="msg" id="regMsg"></div>
            </div>

            <div class="login-footer">
                Sudah punya akun? <a href="login.html">Login di sini</a>
            </div>
            <div style="text-align:center; margin-top:12px;">
                <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Kembali ke Beranda</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script>
        (function() {
            'use strict';

            async function doRegister() {
                const email = document.getElementById('regEmail').value.trim();
                const password = document.getElementById('regPassword').value.trim();
                const username = document.getElementById('regUsername').value.trim();
                const fullname = document.getElementById('regFullname').value.trim();
                const msgEl = document.getElementById('regMsg');

                if (!email || !password || !username) {
                    msgEl.className = 'msg error';
                    msgEl.innerText = '⚠️ Semua field wajib diisi.';
                    return;
                }
                if (password.length < 6) {
                    msgEl.className = 'msg error';
                    msgEl.innerText = '⚠️ Password minimal 6 karakter.';
                    return;
                }

                try {
                    await window.signUp(email, password, {
                        username: username,
                        fullname: fullname
                    });
                    
                    msgEl.className = 'msg success';
                    msgEl.innerText = '✅ Pendaftaran berhasil! Cek email untuk verifikasi.';
                    
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 3000);

                } catch (error) {
                    msgEl.className = 'msg error';
                    msgEl.innerText = '❌ ' + error.message;
                }
            }

            document.getElementById('regBtn').addEventListener('click', doRegister);
            document.getElementById('regPassword').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') doRegister();
            });
        })();
    </script>
</body>
</html>
