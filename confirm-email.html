<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Konfirmasi Email · HEDTRO JEANS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #f7f4ef;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 24px;
            padding: 48px 40px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            border: 1px solid #e8edf2;
        }
        .card .icon {
            font-size: 4rem;
            color: #c9a84c;
            margin-bottom: 16px;
        }
        .card h1 {
            font-size: 1.6rem;
            font-weight: 800;
            color: #0b1a2b;
            margin-bottom: 8px;
        }
        .card p {
            color: #1a2e44;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .card .status {
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            margin-bottom: 16px;
        }
        .card .status.success { background: #d4edda; color: #155724; }
        .card .status.error { background: #f8d7da; color: #721c24; }
        .card .status.loading { background: #fff3cd; color: #856404; }
        .btn {
            display: inline-block;
            padding: 12px 32px;
            background: #c9a84c;
            color: #0b1a2b;
            border-radius: 60px;
            font-weight: 700;
            text-decoration: none;
            transition: 0.3s;
        }
        .btn:hover { background: #b8963a; transform: scale(0.98); }
        .btn-outline {
            background: transparent;
            border: 2px solid #c9a84c;
            color: #0b1a2b;
        }
        .btn-outline:hover { background: #c9a84c; }
    </style>
</head>
<body>
    <div class="card" id="confirmCard">
        <div class="icon"><i class="fas fa-envelope"></i></div>
        <h1>Konfirmasi Email</h1>
        <p id="message">Memproses verifikasi email Anda...</p>
        <div class="status loading" id="statusBadge">⏳ Memproses...</div>
        <a href="login.html" class="btn" id="loginBtn" style="display:none;">Login Sekarang</a>
        <a href="index.html" class="btn btn-outline" id="homeBtn" style="display:none; margin-left:8px;">Kembali ke Beranda</a>
    </div>

    <script>
        (function() {
            'use strict';

            const messageEl = document.getElementById('message');
            const statusEl = document.getElementById('statusBadge');
            const loginBtn = document.getElementById('loginBtn');
            const homeBtn = document.getElementById('homeBtn');

            async function confirmEmail() {
                try {
                    // Ambil token dari URL
                    const params = new URLSearchParams(window.location.search);
                    const accessToken = params.get('access_token');
                    const refreshToken = params.get('refresh_token');
                    const type = params.get('type');

                    console.log('🔵 Token:', { accessToken, refreshToken, type });

                    if (!accessToken) {
                        // Coba cek session
                        const session = await window.getSession();
                        if (session) {
                            messageEl.innerHTML = '✅ Email sudah terverifikasi!';
                            statusEl.className = 'status success';
                            statusEl.textContent = '✅ Verifikasi Berhasil';
                            loginBtn.style.display = 'inline-block';
                            homeBtn.style.display = 'inline-block';
                            return;
                        }
                        messageEl.innerHTML = '❌ Token tidak ditemukan. Silakan coba login.';
                        statusEl.className = 'status error';
                        statusEl.textContent = '❌ Gagal Verifikasi';
                        homeBtn.style.display = 'inline-block';
                        return;
                    }

                    // Verifikasi token dengan Supabase
                    const { data, error } = await window.supabase.auth.setSession({
                        access_token: accessToken,
                        refresh_token: refreshToken
                    });

                    if (error) {
                        console.error('❌ Verifikasi error:', error);
                        messageEl.innerHTML = '❌ Gagal verifikasi: ' + error.message;
                        statusEl.className = 'status error';
                        statusEl.textContent = '❌ Gagal Verifikasi';
                        homeBtn.style.display = 'inline-block';
                        return;
                    }

                    console.log('✅ Verifikasi berhasil:', data);

                    // Ambil profile user
                    const profile = await window.getUserProfile();
                    console.log('✅ Profile:', profile);

                    // Update status user di tabel users menjadi verified
                    if (profile) {
                        await window.updateUserProfile({ status: 'verified' });
                        console.log('✅ User status updated to verified');
                    }

                    messageEl.innerHTML = '✅ Email berhasil diverifikasi! Selamat bergabung dengan HEDTRO JEANS.';
                    statusEl.className = 'status success';
                    statusEl.textContent = '✅ Verifikasi Berhasil';
                    loginBtn.style.display = 'inline-block';
                    homeBtn.style.display = 'inline-block';

                    // Redirect setelah 3 detik
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 3000);

                } catch (error) {
                    console.error('❌ Error:', error);
                    messageEl.innerHTML = '❌ Terjadi kesalahan: ' + (error.message || 'Unknown error');
                    statusEl.className = 'status error';
                    statusEl.textContent = '❌ Gagal Verifikasi';
                    homeBtn.style.display = 'inline-block';
                }
            }

            // Jalankan
            confirmEmail();

        })();
    </script>
</body>
</html>
