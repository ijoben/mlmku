<!DOCTYPE html>
<html>
<head>
  <title>Test Supabase Connection</title>
  <meta charset="UTF-8">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
</head>
<body>
  <h1>🔍 Test Supabase Connection</h1>
  <div id="result" style="font-family: monospace; padding: 20px; background: #f5f5f5; border-radius: 8px;"></div>

  <script>
    (async function() {
      const resultDiv = document.getElementById('result');
      let log = '';

      function addLog(msg, isError = false) {
        const prefix = isError ? '❌' : '✅';
        log += `<div style="color: ${isError ? 'red' : 'green'}">${prefix} ${msg}</div>`;
        resultDiv.innerHTML = log;
        console.log(msg);
      }

      try {
        addLog('1. Cek window.supabase: ' + typeof window.supabase);
        addLog('2. Cek window.getProducts: ' + typeof window.getProducts);
        addLog('3. Cek window.getSession: ' + typeof window.getSession);
        addLog('4. Cek window.getSettings: ' + typeof window.getSettings);
        addLog('5. Cek window.getSlides: ' + typeof window.getSlides);

        if (typeof window.getProducts !== 'function') {
          addLog('ERROR: window.getProducts is not a function!', true);
          addLog('Pastikan supabase.js sudah benar dan tidak error.', true);
          return;
        }

        addLog('6. Mencoba ambil Products...');
        const products = await window.getProducts();
        addLog('Products berhasil: ' + products.length + ' item');

        addLog('7. Mencoba ambil Slides...');
        const slides = await window.getSlides();
        addLog('Slides berhasil: ' + slides.length + ' item');

        addLog('8. Mencoba ambil Settings...');
        const settings = await window.getSettings();
        addLog('Settings berhasil: ' + Object.keys(settings).length + ' key');

        addLog('9. Mencoba ambil About...');
        const about = await window.getAbout();
        addLog('About berhasil: ' + (about.title || 'no title'));

        addLog('10. Mencoba ambil Footer...');
        const footer = await window.getFooter();
        addLog('Footer berhasil: ' + (footer.brand || 'no brand'));

        addLog('========================================');
        addLog('🎉 SEMUA BERHASIL! Supabase connected!');
        addLog('Sekarang buka index.html');

      } catch (error) {
        addLog('ERROR: ' + error.message, true);
        addLog('Stack: ' + (error.stack || 'no stack'), true);
        console.error('Full error:', error);
      }
    })();
  </script>
</body>
</html>
