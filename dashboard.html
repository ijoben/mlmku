<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Dashboard · HEDTRO JEANS</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
  <style>
    /* ===== RESET & ROOT ===== */
    * { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --denim-dark: #0b1a2b;
      --denim-navy: #1a2e44;
      --denim-blue: #2a4b6e;
      --denim-light: #e8edf2;
      --gold-accent: #c9a84c;
      --gold-light: #e8d5a3;
      --cream: #f7f4ef;
      --white: #ffffff;
      --shadow: 0 4px 20px rgba(0,0,0,0.08);
      --shadow-lg: 0 20px 60px rgba(0,0,0,0.15);
      --radius: 28px;
      --radius-sm: 14px;
      --transition: 0.3s cubic-bezier(0.4,0,0.2,1);
    }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--cream);
      color: var(--denim-dark);
      padding-top: 70px;
      overflow-x: hidden;
    }
    a { text-decoration:none; color:inherit; }
    button { cursor:pointer; font-family:inherit; border:none; background:none; }
    ::-webkit-scrollbar { width:6px; }
    ::-webkit-scrollbar-track { background:var(--cream); }
    ::-webkit-scrollbar-thumb { background:var(--denim-blue); border-radius:10px; }

    /* ===== NAVBAR ===== */
    .navbar {
      position: fixed; top:0; left:0; right:0; z-index:1000;
      background: var(--denim-dark);
      padding: 12px 20px;
      display: flex; align-items:center; justify-content:space-between;
      border-bottom:3px solid var(--gold-accent);
      height:70px;
    }
    .navbar .logo {
      display:flex; align-items:center; gap:8px;
      color:var(--white); font-weight:800; font-size:1.4rem;
    }
    .navbar .logo i { color:var(--gold-accent); font-size:1.6rem; }
    .navbar .logo span { font-weight:300; color:var(--gold-light); font-size:0.75rem; margin-left:2px; }
    .nav-right {
      display:flex; align-items:center; gap:12px;
    }
    .nav-right .user-badge {
      display:flex; align-items:center; gap:6px;
      color:var(--cream); font-size:0.8rem;
      background:rgba(255,255,255,0.08);
      padding:6px 14px; border-radius:60px;
      border:1px solid rgba(255,255,255,0.06);
      cursor:pointer;
    }
    .nav-right .user-badge i { color:var(--gold-accent); }

    /* ===== BURGER ===== */
    .burger-btn {
      display:flex; flex-direction:column; gap:5px;
      padding:6px; background:transparent; border:none; cursor:pointer;
      z-index:1001;
    }
    .burger-btn span {
      display:block; width:28px; height:3px;
      background:var(--cream); border-radius:4px;
      transition:var(--transition); transform-origin:center;
    }
    .burger-btn.active span:nth-child(1) { transform:translateY(8px) rotate(45deg); }
    .burger-btn.active span:nth-child(2) { opacity:0; transform:scaleX(0); }
    .burger-btn.active span:nth-child(3) { transform:translateY(-8px) rotate(-45deg); }

    /* ===== SIDEBAR ===== */
    .sidebar-overlay {
      position:fixed; top:0; left:0; width:100%; height:100%;
      background:rgba(0,0,0,0.5); z-index:999;
      opacity:0; pointer-events:none;
      transition:var(--transition);
    }
    .sidebar-overlay.active { opacity:1; pointer-events:all; }
    .sidebar {
      position:fixed; top:0; left:-320px; width:300px; height:100%;
      background:var(--denim-dark); z-index:1000;
      padding:24px 20px; transition:var(--transition);
      overflow-y:auto; border-right:3px solid var(--gold-accent);
      display:flex; flex-direction:column; gap:4px;
    }
    .sidebar.open { left:0; }
    .sidebar .sidebar-header {
      display:flex; align-items:center; justify-content:space-between;
      padding-bottom:20px; border-bottom:1px solid rgba(255,255,255,0.08);
      margin-bottom:12px;
    }
    .sidebar .sidebar-header .logo-side {
      color:var(--white); font-weight:800; font-size:1.3rem;
    }
    .sidebar .sidebar-header .logo-side i { color:var(--gold-accent); }
    .sidebar .sidebar-header .close-side {
      color:var(--cream); font-size:1.6rem; cursor:pointer;
    }
    .sidebar .menu-item {
      display:flex; align-items:center; gap:14px;
      padding:12px 16px; border-radius:12px;
      color:var(--cream); font-weight:500; font-size:0.95rem;
      transition:var(--transition); cursor:pointer;
    }
    .sidebar .menu-item:hover { background:rgba(255,255,255,0.08); }
    .sidebar .menu-item i { width:24px; color:var(--gold-accent); }
    .sidebar .menu-item.active { background:rgba(201,168,76,0.15); color:var(--gold-accent); }
    .sidebar .menu-divider { height:1px; background:rgba(255,255,255,0.06); margin:6px 0; }
    .sidebar .menu-item.logout { margin-top:auto; color:#e74c3c; }
    .sidebar .menu-item.logout i { color:#e74c3c; }

    /* ===== CONTENT ===== */
    .container { max-width:1100px; margin:0 auto; padding:20px 24px 40px; }
    .page-title {
      font-size:1.6rem; font-weight:700; color:var(--denim-dark);
      margin-bottom:20px; display:flex; align-items:center; gap:12px;
    }
    .page-title i { color:var(--gold-accent); }

    /* ===== STATUS ===== */
    #statusBanner {
      padding:14px 20px; border-radius:var(--radius-sm);
      margin-bottom:20px;
      display:flex; align-items:center; flex-wrap:wrap; gap:10px;
      font-weight:500;
    }
    .status-free { background:#f8d7da; color:#721c24; }
    .status-pending { background:#fff3cd; color:#856404; }
    .status-verified { background:#d4edda; color:#155724; }
    .btn-sm {
      padding:8px 18px; border-radius:60px; font-weight:600; font-size:0.8rem;
      transition:var(--transition); font-family:inherit;
    }
    .btn-sm-success { background:#1f7a4b; color:#fff; }
    .btn-sm-success:hover { background:#155d38; }
    .btn-sm-primary { background:var(--denim-blue); color:#fff; }
    .btn-sm-primary:hover { background:var(--denim-dark); }
    .btn-sm-gold { background:var(--gold-accent); color:var(--denim-dark); }
    .btn-sm-gold:hover { background:#b8963a; }

    /* ===== STATS ===== */
    .stats-grid {
      display:grid; grid-template-columns:repeat(auto-fit, minmax(170px,1fr));
      gap:16px; margin-bottom:28px;
    }
    .stat-card {
      background:var(--white); border-radius:var(--radius-sm);
      padding:18px 20px; border-left:4px solid var(--gold-accent);
      box-shadow:var(--shadow);
    }
    .stat-card .label {
      font-size:0.7rem; text-transform:uppercase;
      color:var(--denim-blue); font-weight:600; letter-spacing:0.3px;
    }
    .stat-card .value {
      font-size:1.8rem; font-weight:700; color:var(--denim-dark);
      margin-top:4px;
    }

    /* ===== HISTORY ===== */
    .history-card {
      background:var(--white); border-radius:var(--radius-sm);
      padding:18px 20px; box-shadow:var(--shadow);
      margin-top:12px;
    }
    .history-card h3 {
      font-size:1rem; font-weight:600; margin-bottom:12px;
      display:flex; align-items:center; gap:8px;
    }
    .history-card h3 i { color:var(--gold-accent); }
    .history-item {
      display:flex; justify-content:space-between;
      padding:10px 0; border-bottom:1px solid #eee;
      font-size:0.9rem;
    }
    .history-item:last-child { border-bottom:none; }
    .history-item .amount { font-weight:700; }
    .history-item .amount.plus { color:#1f7a4b; }
    .history-item .amount.minus { color:#b13e3e; }

    /* ===== WALLET ===== */
    .wallet-card {
      background:var(--denim-dark); color:var(--cream);
      border-radius:var(--radius-sm); padding:20px 24px;
      margin-bottom:20px;
      display:flex; justify-content:space-between; align-items:center;
      flex-wrap:wrap; gap:12px;
    }
    .wallet-card .wallet-label { font-size:0.85rem; opacity:0.7; }
    .wallet-card .wallet-amount { font-size:2rem; font-weight:700; color:var(--gold-accent); }

    /* ===== RESPONSIVE ===== */
    @media (max-width:768px) {
      body { padding-top:60px; }
      .navbar { padding:10px 16px; height:60px; }
      .navbar .logo { font-size:1.2rem; }
      .navbar .logo i { font-size:1.3rem; }
      .nav-right .user-badge span { display:none; }
      .sidebar { width:280px; left:-300px; }
      .container { padding:16px 16px 30px; }
      .page-title { font-size:1.3rem; }
      .stats-grid { grid-template-columns:1fr 1fr; gap:12px; }
      .stat-card .value { font-size:1.4rem; }
    }
    @media (max-width:480px) {
      .stats-grid { grid-template-columns:1fr 1fr; gap:8px; }
      .stat-card { padding:12px 14px; }
      .stat-card .value { font-size:1.2rem; }
    }
  </style>
</head>
<body>

  <!-- ===== NAVBAR ===== -->
  <header class="navbar">
    <div class="logo">
      <i class="fas fa-tshirt"></i> HEDTRO<span>JEANS</span>
    </div>
    <div class="nav-right">
      <div class="user-badge" id="navUserBadge">
        <i class="fas fa-user-circle"></i> <span id="navUserName">Member</span>
      </div>
      <button class="burger-btn" id="burgerBtn" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <!-- ===== SIDEBAR ===== -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo-side"><i class="fas fa-tshirt"></i> HEDTRO</div>
      <span class="close-side" id="closeSidebar">&times;</span>
    </div>
    <div class="menu-item active" data-page="dashboard"><i class="fas fa-chart-line"></i> Dashboard</div>
    <div class="menu-item" data-page="network"><i class="fas fa-sitemap"></i> Jaringan</div>
    <div class="menu-item" data-page="deposit"><i class="fas fa-plus-circle"></i> Deposit</div>
    <div class="menu-item" data-page="withdraw"><i class="fas fa-minus-circle"></i> Withdraw</div>
    <div class="menu-divider"></div>
    <div class="menu-item" data-page="products"><i class="fas fa-tshirt"></i> Koleksi</div>
    <div class="menu-item" data-page="history"><i class="fas fa-history"></i> Riwayat</div>
    <div class="menu-divider"></div>
    <div class="menu-item logout" id="sideLogoutBtn"><i class="fas fa-sign-out-alt"></i> Keluar</div>
  </nav>

  <!-- ===== CONTENT ===== -->
  <div class="container">
    <h1 class="page-title"><i class="fas fa-chart-line"></i> Dashboard</h1>

    <!-- Status Banner -->
    <div id="statusBanner">Memuat status...</div>

    <!-- Wallet -->
    <div class="wallet-card">
      <div>
        <div class="wallet-label"><i class="fas fa-wallet"></i> Saldo Dompet</div>
        <div class="wallet-amount" id="walletAmount">Rp 0</div>
      </div>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button class="btn-sm btn-sm-gold" id="depositBtn"><i class="fas fa-plus-circle"></i> Deposit</button>
        <button class="btn-sm btn-sm-primary" id="withdrawBtn"><i class="fas fa-minus-circle"></i> Withdraw</button>
      </div>
    </div>

    <!-- Statistik Bonus -->
    <div class="stats-grid">
      <div class="stat-card"><div class="label">Sponsor Bonus</div><div class="value" id="sponsorBonus">0</div></div>
      <div class="stat-card"><div class="label">Binary Bonus</div><div class="value" id="binaryBonus">0</div></div>
      <div class="stat-card"><div class="label">Reward 5L</div><div class="value" id="rewardBonus">0</div></div>
      <div class="stat-card"><div class="label">RO Produk</div><div class="value" id="roBonus">0</div></div>
    </div>

    <!-- Riwayat Transaksi -->
    <div class="history-card">
      <h3><i class="fas fa-history"></i> Riwayat Transaksi</h3>
      <div id="transactionHistory">
        <p class="text-muted">Belum ada transaksi.</p>
      </div>
    </div>
  </div>

  <script>
    // ============================================================
    // JAVASCRIPT LENGKAP dashboard.html
    // ============================================================
    (function() {
      'use strict';

      const DB_KEY = 'hedtro_mlm_users';
      const PRODUCT_KEY = 'hedtro_products';
      const SETTINGS_KEY = 'hedtro_settings';

      function loadUsers() { return JSON.parse(localStorage.getItem(DB_KEY) || '[]'); }
      function saveUsers(u) { localStorage.setItem(DB_KEY, JSON.stringify(u)); }
      function loadProducts() { return JSON.parse(localStorage.getItem(PRODUCT_KEY) || '[]'); }
      function loadSettings() { return JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{"memberPrice":550000}'); }

      let users = loadUsers();
      let products = loadProducts();
      let settings = loadSettings();

      const session = localStorage.getItem('mlm_session');
      let currentUser = null;
      if (session) {
        try {
          const { id } = JSON.parse(session);
          currentUser = users.find(u => u.id === id);
          if (!currentUser || currentUser.email === 'admin@mlm.com') {
            window.location.href = 'index.html';
            return;
          }
        } catch (_) { window.location.href = 'index.html'; return; }
      } else {
        window.location.href = 'index.html';
        return;
      }

      // ===== DOM REFS =====
      const navUserName = document.getElementById('navUserName');
      const burgerBtn = document.getElementById('burgerBtn');
      const sidebar = document.getElementById('sidebar');
      const sidebarOverlay = document.getElementById('sidebarOverlay');
      const closeSidebar = document.getElementById('closeSidebar');
      const statusBanner = document.getElementById('statusBanner');
      const walletAmount = document.getElementById('walletAmount');

      // ===== SIDEBAR =====
      function toggleSidebar(open) {
        const isOpen = open !== undefined ? open : !sidebar.classList.contains('open');
        sidebar.classList.toggle('open', isOpen);
        sidebarOverlay.classList.toggle('active', isOpen);
        burgerBtn.classList.toggle('active', isOpen);
        document.body.style.overflow = isOpen ? 'hidden' : '';
      }
      burgerBtn.addEventListener('click', () => toggleSidebar());
      closeSidebar.addEventListener('click', () => toggleSidebar(false));
      sidebarOverlay.addEventListener('click', () => toggleSidebar(false));

      // ===== NAVIGASI SIDEBAR =====
      document.querySelectorAll('.sidebar .menu-item[data-page]').forEach(item => {
        item.addEventListener('click', function() {
          const page = this.dataset.page;
          toggleSidebar(false);
          if (page === 'dashboard') {
            // sudah di halaman
          } else if (page === 'network') {
            alert('📊 Halaman Jaringan (Binary Tree) akan menampilkan struktur cabang member Anda.');
          } else if (page === 'deposit') {
            const nominal = prompt('Masukkan nominal deposit (Rp):');
            if (nominal && !isNaN(nominal) && parseInt(nominal) > 0) {
              deposit(parseInt(nominal));
            }
          } else if (page === 'withdraw') {
            const nominal = prompt('Masukkan nominal withdraw (Rp):');
            if (nominal && !isNaN(nominal) && parseInt(nominal) > 0) {
              withdraw(parseInt(nominal));
            }
          } else if (page === 'products') {
            window.location.href = 'index.html';
          } else if (page === 'history') {
            renderHistory();
          }
        });
      });

      document.getElementById('sideLogoutBtn').addEventListener('click', function() {
        localStorage.removeItem('mlm_session');
        window.location.href = 'index.html';
      });

      // ===== DEPOSIT & WITHDRAW =====
      function deposit(amount) {
        if (amount <= 0) { alert('Nominal harus lebih dari 0'); return; }
        currentUser.wallet = (currentUser.wallet || 0) + amount;
        if (!currentUser.transactions) currentUser.transactions = [];
        currentUser.transactions.push({
          type: 'deposit',
          amount: amount,
          date: new Date().toISOString(),
          status: 'success'
        });
        saveUsers(users);
        renderDashboard();
        alert('✅ Deposit Rp ' + amount.toLocaleString() + ' berhasil!');
      }

      function withdraw(amount) {
        if (amount <= 0) { alert('Nominal harus lebih dari 0'); return; }
        if ((currentUser.wallet || 0) < amount) {
          alert('❌ Saldo tidak mencukupi!');
          return;
        }
        currentUser.wallet = (currentUser.wallet || 0) - amount;
        if (!currentUser.transactions) currentUser.transactions = [];
        currentUser.transactions.push({
          type: 'withdraw',
          amount: amount,
          date: new Date().toISOString(),
          status: 'pending'
        });
        saveUsers(users);
        renderDashboard();
        alert('✅ Permintaan withdraw Rp ' + amount.toLocaleString() + ' sedang diproses.');
      }

      // Tombol aksi
      document.getElementById('depositBtn').addEventListener('click', () => {
        const nominal = prompt('Masukkan nominal deposit (Rp):');
        if (nominal && !isNaN(nominal) && parseInt(nominal) > 0) {
          deposit(parseInt(nominal));
        }
      });
      document.getElementById('withdrawBtn').addEventListener('click', () => {
        const nominal = prompt('Masukkan nominal withdraw (Rp):');
        if (nominal && !isNaN(nominal) && parseInt(nominal) > 0) {
          withdraw(parseInt(nominal));
        }
      });

      // ===== RENDER DASHBOARD =====
      function renderDashboard() {
        navUserName.textContent = currentUser.name;

        // Status
        const statusMap = {
          'free': { class: 'status-free', text: '❌ Free Member — Kirim bukti transfer untuk verifikasi' },
          'pending': { class: 'status-pending', text: '⏳ Menunggu Verifikasi — Admin akan memproses bukti transfer Anda' },
          'verified': { class: 'status-verified', text: '✅ Verified Member — Selamat bergabung! Anda bisa melakukan repeat order.' }
        };
        const status = statusMap[currentUser.status] || statusMap['free'];
        statusBanner.className = status.class;
        statusBanner.innerHTML = status.text;

        // Wallet
        walletAmount.textContent = 'Rp ' + (currentUser.wallet || 0).toLocaleString();

        // Bonus
        document.getElementById('sponsorBonus').textContent = currentUser.bonus_sponsor || 0;
        document.getElementById('binaryBonus').textContent = currentUser.bonus_binary || 0;
        document.getElementById('rewardBonus').textContent = currentUser.bonus_reward || 0;
        document.getElementById('roBonus').textContent = currentUser.bonus_ro || 0;

        // History
        renderHistory();
      }

      function renderHistory() {
        const container = document.getElementById('transactionHistory');
        const transactions = currentUser.transactions || [];

        if (transactions.length === 0) {
          container.innerHTML = '<p class="text-muted">Belum ada transaksi.</p>';
          return;
        }

        let html = '';
        // Tampilkan 10 terakhir (terbaru di atas)
        const sorted = [...transactions].reverse().slice(0, 10);
        sorted.forEach(t => {
          const typeLabel = t.type === 'deposit' ? 'Deposit' : 'Withdraw';
          const amountClass = t.type === 'deposit' ? 'plus' : 'minus';
          const statusText = t.status === 'pending' ? '⏳ Pending' : (t.status === 'success' ? '✅ Selesai' : '❌ Gagal');
          html += `
            <div class="history-item">
              <span>${typeLabel} ${statusText}</span>
              <span class="amount ${amountClass}">${t.type === 'deposit' ? '+' : '-'} Rp ${t.amount.toLocaleString()}</span>
            </div>
          `;
        });
        container.innerHTML = html;
      }

      // ===== NAV BADGE REFRESH =====
      document.getElementById('navUserBadge').addEventListener('click', function() {
        users = loadUsers();
        const updated = users.find(u => u.id === currentUser.id);
        if (updated) {
          currentUser = updated;
          renderDashboard();
        }
      });

      // ===== INIT =====
      renderDashboard();
      console.log('🟦 HEDTRO · Dashboard Member (dengan Deposit/Withdraw)');
    })();
  </script>
</body>
</html>
