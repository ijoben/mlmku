<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Dashboard · HEDTRO JEANS</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
  <style>
    /* ===== SAMA SEPERTI SEBELUMNYA (saya singkat, gunakan dari file sebelumnya) ===== */
    * { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --denim-dark: #0b1a2b;
      --denim-navy: #1a2e44;
      --denim-blue: #2a4b6e;
      --denim-light: #e8edf2;
      --gold-accent: #c9a84c;
      --gold-light: #e8d5a3;
      --cream: #f7f4ef;
      --white: #ffffff;
      --shadow: 0 4px 20px rgba(0,0,0,0.08);
      --shadow-lg: 0 20px 60px rgba(0,0,0,0.15);
      --radius: 28px;
      --radius-sm: 14px;
      --transition: 0.3s cubic-bezier(0.4,0,0.2,1);
      --sidebar-width: 280px;
    }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--cream);
      color: var(--denim-dark);
      padding-top: 70px;
      overflow-x: hidden;
    }
    /* ... (saya skip gaya karena sama dengan sebelumnya) ... */
  </style>
</head>
<body>
  <!-- ===== NAVBAR & SIDEBAR ===== -->
  <!-- (sama seperti sebelumnya) -->

  <div class="main-content" id="mainContent">
    <!-- Semua section sama -->
    <div class="section-content" id="sec-products">
      <h1 class="page-title"><i class="fas fa-tshirt"></i> Koleksi Produk</h1>
      <div id="bankInfo" style="background:var(--denim-light); padding:12px 18px; border-radius:var(--radius-sm); margin-bottom:16px;">
        <p><strong>💳 Transfer ke Rekening Admin:</strong></p>
        <p id="bankDetail">Bank: BCA · No. Rek: 1234567890 · a.n. HEDTRO JEANS</p>
        <p class="text-muted" style="font-size:0.8rem;">Setelah transfer, admin akan memproses pesanan Anda.</p>
      </div>
      <div class="product-grid" id="productGridDashboard"></div>
    </div>
  </div>

  <script>
    (function() {
      'use strict';

      const DB_KEY = 'hedtro_mlm_users';
      const PRODUCT_KEY = 'hedtro_products';
      const SETTINGS_KEY = 'hedtro_settings';
      const BANK_KEY = 'hedtro_bank_info';

      function loadUsers() { return JSON.parse(localStorage.getItem(DB_KEY) || '[]'); }
      function saveUsers(u) { localStorage.setItem(DB_KEY, JSON.stringify(u)); }
      function loadProducts() { return JSON.parse(localStorage.getItem(PRODUCT_KEY) || '[]'); }
      function saveProducts(p) { localStorage.setItem(PRODUCT_KEY, JSON.stringify(p)); }
      function loadSettings() { return JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{"sponsorBonus":10,"binaryBonus":8,"rewardBonus":5,"roBonus":3,"memberPrice":550000}'); }
      function saveSettings(s) { localStorage.setItem(SETTINGS_KEY, JSON.stringify(s)); }
      function loadBankInfo() { return JSON.parse(localStorage.getItem(BANK_KEY) || '{"bank":"BCA","account":"1234567890","name":"HEDTRO JEANS"}'); }

      let bankInfo = loadBankInfo();

      const session = localStorage.getItem('mlm_session');
      let currentUser = null;
      if (session) {
        try {
          const { id } = JSON.parse(session);
          let users = loadUsers();
          currentUser = users.find(u => u.id === id);
          if (!currentUser || currentUser.email === 'admin@mlm.com') {
            window.location.href = 'index.html';
            return;
          }
        } catch (_) { window.location.href = 'index.html'; return; }
      } else {
        window.location.href = 'index.html';
        return;
      }

      // ===== FUNGSI BUY RO (DIPERBAIKI) =====
      function buyRO(productId, price) {
        if (currentUser.status !== 'verified') {
          alert('❌ Anda harus terverifikasi (verified) untuk melakukan repeat order.');
          return;
        }

        // Ambil data produk terbaru
        let freshProducts = loadProducts();
        const product = freshProducts.find(p => p.id === productId);
        if (!product) { alert('Produk tidak ditemukan'); return; }
        if (product.stock <= 0) { alert('Stok habis'); return; }

        if (!confirm(`Beli ${product.name} seharga Rp ${price.toLocaleString()}? Anda akan transfer ke rekening admin.`)) return;

        // Kurangi stok
        product.stock--;
        saveProducts(freshProducts);

        // Ambil data user terbaru
        let freshUsers = loadUsers();
        const user = freshUsers.find(u => u.id === currentUser.id);
        if (!user) { alert('User tidak ditemukan'); return; }

        // Tambahkan transaksi
        if (!user.transactions) user.transactions = [];
        user.transactions.push({
          type: 'ro_purchase',
          productId: productId,
          productName: product.name,
          amount: price,
          date: new Date().toISOString(),
          status: 'pending',
          note: `Menunggu pembayaran transfer ke ${bankInfo.bank} - ${bankInfo.account}`
        });

        if (!user.purchase_history) user.purchase_history = [];
        user.purchase_history.push({
          productId: productId,
          productName: product.name,
          price: price,
          date: new Date().toISOString(),
          status: 'pending'
        });

        // Simpan ke localStorage
        saveUsers(freshUsers);

        // Update currentUser
        currentUser = user;
        localStorage.setItem('mlm_session', JSON.stringify({ id: user.id }));

        alert('✅ Pesanan RO berhasil! Silakan transfer ke rekening admin dan tunggu konfirmasi. Cek menu Riwayat.');
        renderDashboard();
        renderProductsDashboard();
        showSection('history');
      }

      // ===== RENDER PRODUK =====
      function renderProductsDashboard() {
        const grid = document.getElementById('productGridDashboard');
        if (!grid) return;
        const products = loadProducts();
        grid.innerHTML = '';
        if (products.length === 0) {
          grid.innerHTML = '<p class="text-muted">Belum ada produk.</p>';
          return;
        }
        products.forEach(p => {
          const card = document.createElement('div');
          card.className = 'product-card';
          card.innerHTML = `
            <div class="img-placeholder"><i class="fas ${p.icon || 'fa-tshirt'}"></i></div>
            <div class="body">
              <span class="tag">${p.tag || 'PRODUK'}</span>
              <h4>${p.name}</h4>
              <div class="price">Rp ${p.price.toLocaleString()} <del>Rp ${p.original?.toLocaleString() || ''}</del></div>
              <div style="font-size:0.7rem;color:#6a7e9a;">Stok: ${p.stock}</div>
              <button class="btn-sm btn-sm-gold buy-ro-btn" data-id="${p.id}" data-price="${p.price}">Beli (RO)</button>
            </div>
          `;
          grid.appendChild(card);
        });

        document.querySelectorAll('.buy-ro-btn').forEach(btn => {
          btn.addEventListener('click', function() {
            const productId = parseInt(this.dataset.id);
            const price = parseInt(this.dataset.price);
            buyRO(productId, price);
          });
        });
      }

      // ===== RENDER DASHBOARD =====
      function renderDashboard() {
        // Ambil data terbaru
        let freshUsers = loadUsers();
        const user = freshUsers.find(u => u.id === currentUser.id);
        if (user) {
          currentUser = user;
          localStorage.setItem('mlm_session', JSON.stringify({ id: user.id }));
        }

        document.getElementById('navUserName').textContent = currentUser.name;
        document.getElementById('walletAmount').textContent = 'Rp ' + (currentUser.wallet || 0).toLocaleString();
        document.getElementById('sponsorBonus').textContent = currentUser.bonus_sponsor || 0;
        document.getElementById('binaryBonus').textContent = currentUser.bonus_binary || 0;
        document.getElementById('rewardBonus').textContent = currentUser.bonus_reward || 0;
        document.getElementById('roBonus').textContent = currentUser.bonus_ro || 0;

        // Status
        const statusMap = {
          'free': { class: 'status-free', text: '❌ Free Member — Kirim bukti transfer ke admin untuk verifikasi' },
          'pending': { class: 'status-pending', text: '⏳ Menunggu Verifikasi — Admin akan memproses' },
          'verified': { class: 'status-verified', text: '✅ Verified Member — Selamat bergabung!' }
        };
        const status = statusMap[currentUser.status] || statusMap['free'];
        const banner = document.getElementById('statusBanner');
        banner.className = status.class;
        banner.innerHTML = status.text;

        renderTransactionHistory();
      }

      function renderTransactionHistory() {
        const container = document.getElementById('transactionHistory');
        const transactions = currentUser.transactions || [];
        if (transactions.length === 0) {
          container.innerHTML = '<p class="text-muted">Belum ada transaksi.</p>';
          return;
        }
        let html = '';
        const sorted = [...transactions].reverse().slice(0, 5);
        sorted.forEach(t => {
          const typeLabel = t.type === 'deposit' ? 'Deposit' : (t.type === 'ro_purchase' ? 'RO Purchase' : 'Withdraw');
          const amountClass = (t.type === 'deposit' || t.type === 'ro_purchase') ? 'plus' : 'minus';
          const statusText = t.status === 'pending' ? '⏳ Pending' : (t.status === 'success' ? '✅ Selesai' : '❌ Gagal');
          html += `<div class="history-item"><span>${typeLabel} ${statusText}</span><span class="amount ${amountClass}">${(t.type === 'deposit' || t.type === 'ro_purchase') ? '+' : '-'} Rp ${t.amount.toLocaleString()}</span></div>`;
        });
        container.innerHTML = html;
      }

      // ===== SHOW SECTION =====
      function showSection(sectionId) {
        document.querySelectorAll('.section-content').forEach(el => el.classList.remove('active'));
        const el = document.getElementById('sec-' + sectionId);
        if (el) el.classList.add('active');
        document.querySelectorAll('.sidebar .menu-item[data-section]').forEach(m => m.classList.remove('active'));
        const menu = document.querySelector(`.sidebar .menu-item[data-section="${sectionId}"]`);
        if (menu) menu.classList.add('active');
        if (sectionId === 'products') renderProductsDashboard();
        if (sectionId === 'dashboard') renderDashboard();
      }

      // ===== SIDEBAR EVENTS =====
      document.querySelectorAll('.sidebar .menu-item[data-section]').forEach(item => {
        item.addEventListener('click', function() {
          showSection(this.dataset.section);
        });
      });

      document.getElementById('sideLogoutBtn').addEventListener('click', function() {
        localStorage.removeItem('mlm_session');
        window.location.href = 'index.html';
      });

      // ===== INIT =====
      renderDashboard();
      renderProductsDashboard();

      // Auto-refresh setiap 15 detik
      setInterval(() => {
        renderDashboard();
        const activeSection = document.querySelector('.sidebar .menu-item.active')?.dataset.section;
        if (activeSection === 'products') renderProductsDashboard();
      }, 15000);

      console.log('🟦 HEDTRO · Dashboard dengan RO fix');
    })();
  </script>
</body>
</html>
